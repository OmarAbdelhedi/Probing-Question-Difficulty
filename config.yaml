# Activation-extraction settings for main.py. Paths come from the command line.

model_name: "Qwen/Qwen2.5-32B-Instruct"  # default model; override per run with `main.py --model`
dtype: "bfloat16"       # float16 | bfloat16 | float32 (float16 on CPU falls back to float32)
device: "cuda"          # cuda | cpu (falls back to cpu when CUDA is unavailable)
pooling: "last_token"   # last_token (last non-padding token) | mean (mask-weighted mean)
layers: "all"           # "all" hidden states (index 0 = embeddings) or a list of indices
seed: 0                 # seeds python / numpy / torch
batch_size: 16          # questions per forward pass
